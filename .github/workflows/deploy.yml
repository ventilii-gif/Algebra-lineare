name: Deploy su GitHub Pages

on:
  push:
    branches:
      - main
      - claude/algebra-lineare-web-app-vr0j3p
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Consenti un solo deploy concorrente
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Con la pubblicazione via workflow il file CNAME non viene letto:
      # il dominio va impostato dalle API. Non blocca il deploy se fallisce.
      - name: Imposta il dominio personalizzato
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DOMINIO: algebra-lineare.ventilii.ai
        run: |
          echo "Imposto $DOMINIO su ${{ github.repository }}"
          gh api -X PUT "repos/${{ github.repository }}/pages" -f "cname=$DOMINIO"
          gh api "repos/${{ github.repository }}/pages" --jq '{cname, html_url, https_enforced}'
