name: Deploy su GitHub Pages

on:
  push:
    branches:
      - main
      - claude/algebra-lineare-web-app-vr0j3p
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Consenti un solo deploy concorrente
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Solo il branch di default è autorizzato a pubblicare sull'ambiente
    # github-pages: da ogni altro branch il job viene rifiutato dalle regole
    # dell'ambiente e la run risulta fallita. Con questa condizione gli altri
    # branch si limitano a compilare, e se un domani il branch di default
    # cambia (per esempio diventa main) la pubblicazione lo segue da sola.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
